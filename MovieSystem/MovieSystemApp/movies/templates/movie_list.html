{% extends 'base.html' %}
{% block content %}
<h1 class="mb-3">Movies</h1>

<form method="get" class="row g-2 mb-4">
  <div class="col-md-9">
    <input type="text" name="q" value="{{ query }}" class="form-control"
           placeholder="Search by name or genre">
  </div>
  <div class="col-md-3 d-flex gap-2">
    <button class="btn btn-primary" type="submit">Search</button>
    <a class="btn btn-outline-secondary" href="{% url 'movie_list' %}">Clear</a>
  </div>
</form>

<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr><th>Name</th><th>Genre</th><th>Director</th><th>Release Date</th></tr>
  </thead>
  <tbody>
    {% for m in movies %}
    <tr>
      <td><a href="{% url 'movie_detail' m.pk %}">{{ m.name }}</a></td>
      <td>{{ m.genre }}</td>
      <td>{{ m.director }}</td>
      <td>{{ m.release_date }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="text-center">No movies found.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
