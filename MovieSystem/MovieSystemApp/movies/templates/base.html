{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Bootstrap Font Icon CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="{% static 'style.css' %}">

    <title>{% block title %}Movie System{% endblock title %}</title>
</head>
<body>

    <div class="center-column">
        <div class="text-center">
            <h3>Movie System</h3>
            <hr>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <a class="btn btn-outline-dark" href="{% url 'movie_list' %}">
                <i class="fa-solid fa-film"></i> All Movies
            </a>
            <a class="btn btn-success" href="{% url 'movie_add' %}">
                <i class="fa-solid fa-plus"></i> Add Movie
            </a>
        </div>

        {% block content %}
        {% endblock content %}
    </div>

    <footer class="center-column">
        <div class="text-center text-dark p-3">
            <p>&copy; <script>document.write(new Date().getFullYear())</script> Lucy Cronin | R00244083</p>
            <a href="https://www.mtu.ie/">
                <img src="{% static 'images/MTU_Logo.png' %}" width="400" height="100" alt="MTU Logo">
            </a>
        </div>
    </footer>

</body>
</html>
