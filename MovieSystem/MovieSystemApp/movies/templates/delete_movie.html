{% extends 'base.html' %}
{% block title %}Delete Movie{% endblock %}
{% block content %}
<div class="card mx-auto text-center" style="max-width: 500px;">
  <div class="card-body">
    <h3>Delete "{{ object.name }}"?</h3>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'movie_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
